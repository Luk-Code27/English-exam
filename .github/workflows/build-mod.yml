name: Build mod

on:
  push:
    paths: ['mod/**', '.github/workflows/build-mod.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: ./gradlew build --stacktrace
      - name: Inspect Minecraft classes (for porting)
        if: always()
        run: |
          ./gradlew -q inspectMinecraft || true
          JAR=$(./gradlew -q inspectMinecraft 2>/dev/null | grep MCJAR | head -1 | sed 's/MCJAR: //')
          echo "jar: $JAR"
          for c in $(cat inspect-classes.txt); do echo "=== $c"; javap -cp "$JAR" -public "$c" 2>&1 | head -80; done
      - name: Publish jar to build-output branch
        if: success()
        run: |
          mkdir -p /tmp/out && cp build/libs/exam_slides-*.jar /tmp/out/
          rm -f /tmp/out/*-sources.jar
          cd /tmp/out
          git init -q -b build-output
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add . && git commit -qm "Build ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" build-output
